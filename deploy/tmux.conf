# ~m4013pi/.tmux.conf for the shared session (web terminal, pirun.sh, ssh).
# Installed by deploy/install.sh.

# Mouse wheel scrolls back through the session's history. Without this tmux
# keeps the browser terminal on its alternate screen, which turns the wheel
# into arrow keys. Hold Shift while dragging to select text for copying.
set -g mouse on
set -g history-limit 50000

# Shift+PageUp / Shift+PageDown scroll by a page, also from the web terminal's
# buttons. Scrolling back to the bottom leaves scroll mode; so do q and Esc.
bind -n S-PPage copy-mode -eu
bind -T copy-mode    S-PPage send -X page-up
bind -T copy-mode    S-NPage send -X page-down
bind -T copy-mode-vi S-PPage send -X page-up
bind -T copy-mode-vi S-NPage send -X page-down
